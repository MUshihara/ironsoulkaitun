name: apply-v61-6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v61-6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems/telemetry.lua)" = "bb44131036c1476a3ac2d4364a011541839a269a"
          test "$(git hash-object systems/transition_watchdog.lua)" = "906be58fb77cf2703da91aef83da222a5b1d849a"
          test "$(git hash-object systems/lobby.lua)" = "f3fb04a913d47fd6ae10db0794e028fa36483577"
          test "$(git hash-object systems/combat.lua)" = "65bdf76dd24106f8d4d940e8e37a13a610f173ac"

      - name: Apply V61.6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v61_6.patch.gz.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/v61_6.patch.gz.b64 | gzip -d > /tmp/v61_6.patch
          git apply --check /tmp/v61_6.patch
          git apply /tmp/v61_6.patch

      - name: Verify resulting files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems/telemetry.lua)" = "f390cf297e7a1f9a84858de90be69a107fb9075a"
          test "$(git hash-object systems/transition_watchdog.lua)" = "95f2193e434eede2e87328143976de616c63e735"
          test "$(git hash-object systems/lobby.lua)" = "1fe9a69f0224149fd3dcfe0c6aabe85ddc1c4290"
          grep -q 'MULTI-MATCH ARCHIVE TELEMETRY V61.6' systems/telemetry.lua
          grep -q 'IronSoul_TransitionLearn_V61_6.json' systems/transition_watchdog.lua
          grep -q 'ORE_FORGE_TARGET = 30' systems/lobby.lua
          grep -q 'ORE_FORGE_TRIGGER_RATIO = 0.90' systems/lobby.lua

      - name: Commit verified sync and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v61-6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync V61.6 telemetry watchdog and balanced forge"
          git push origin HEAD:main
